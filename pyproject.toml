[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energyforecast"
version = "0.1.0"
description = "Day-ahead forecast of Great Britain's electricity demand, compared with the official NESO forecast."
authors = [{ name = "Ege Erenler" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
  "requests>=2.31",
  "mlflow-skinny>=2.12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
energyforecast = "energyforecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
energyforecast = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
