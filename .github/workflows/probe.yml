name: Probe sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          mkdir -p out && cd out
          for id in historic-demand-data 1-day-ahead-demand-forecast day-ahead-half-hourly-demand-forecast-performance demand-data-update; do
            curl -s "https://api.neso.energy/api/3/action/package_show?id=$id" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if not d.get('success'): print('FAIL', d); sys.exit()
          for r in d['result']['resources']: print(r.get('name'), '|', r.get('url'), '|', r.get('last_modified'), '|', r.get('id'))
          " > "pkg_$id.txt" 2>&1
          done
          url=$(grep -i 2025 pkg_historic-demand-data.txt | head -1 | cut -d'|' -f2 | tr -d ' ')
          curl -sL "$url" | head -3 > hist_head.txt
          url=$(grep -i 2026 pkg_historic-demand-data.txt | head -1 | cut -d'|' -f2 | tr -d ' ')
          curl -sL "$url" | tail -3 >> hist_head.txt
          for f in pkg_1-day-ahead-demand-forecast.txt; do
            for url in $(cut -d'|' -f2 $f | tr -d ' ' | head -4); do echo "== $url" >> dayahead_head.txt; curl -sL "$url" | head -4 >> dayahead_head.txt; done
          done
          curl -sL "https://api.neso.energy/dataset/5281b494-5566-42dd-bf1a-9ce38642fabf/resource/08e41551-80f8-4e28-a416-ea473a695db9/download/1b-incentive.csv" > perf.csv
          head -3 perf.csv > perf_head.txt; tail -2 perf.csv >> perf_head.txt; wc -l perf.csv >> perf_head.txt; rm perf.csv
          curl -s "https://archive-api.open-meteo.com/v1/archive?latitude=51.5,52.48&longitude=-0.12,-1.9&start_date=2018-01-01&end_date=2018-01-02&hourly=temperature_2m,shortwave_radiation,wind_speed_10m,cloud_cover&timezone=UTC" | head -c 1500 > meteo_archive.txt
          curl -s "https://api.open-meteo.com/v1/forecast?latitude=51.5,52.48&longitude=-0.12,-1.9&hourly=temperature_2m,shortwave_radiation,wind_speed_10m,cloud_cover&forecast_days=2&timezone=UTC" | head -c 1500 > meteo_forecast.txt
          curl -s "https://historical-forecast-api.open-meteo.com/v1/forecast?latitude=51.5&longitude=-0.12&start_date=2022-01-01&end_date=2022-01-01&hourly=temperature_2m&timezone=UTC" | head -c 600 > meteo_histfc.txt
          curl -s https://www.gov.uk/bank-holidays.json | python3 -c "import json,sys; d=json.load(sys.stdin)['england-and-wales']['events']; print(len(d), d[0], d[-1])" > holidays.txt
      - name: Push
        run: |
          cd out
          git init -q -b probe && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
